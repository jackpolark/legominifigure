  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Minifig Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo-row">
        <span class="stud"></span>
        <span class="stud"></span>
        <h1>Minifig Builder</h1>
        <span class="stud"></span>
        <span class="stud"></span>
      </div>
      <p class="subtitle">Mix & match from thousands of official LEGO parts</p>
    </div>
  </header>

  <main class="main">
    <!-- Preview Column -->
    <aside class="preview-col">
      <div class="preview-card">
        <h3 class="preview-title">Your Minifig</h3>
        <div class="preview-stack" id="previewStack">
          <!-- JS will populate these -->
        </div>
        <button class="btn-randomize" id="randomizeBtn">🎲 Randomize</button>
        <div class="summary-list" id="summaryList"></div>
      </div>
    </aside>

    <!-- Selectors Column -->
    <section class="selectors-col" id="selectorsCol">
      <!-- JS will generate selector cards here -->
    </section>

    <!-- Minifig Lookup Column -->
    <aside class="minifig-lookup-col">
      <div class="minifig-lookup-card">
        <h3 class="preview-title">Find By Minifigure</h3>
        <div class="minifig-search-wrap">
          <input type="text" id="minifigSearchInput" class="theme-search-input" autocomplete="off"
                 spellcheck="false" placeholder="Search minifigure name…">
          <div class="theme-dropdown" id="minifigSearchDropdown" style="display:none"></div>
        </div>
        <div class="minifig-lookup-result" id="minifigLookupResult" style="display:none">
          <img class="minifig-lookup-img" id="minifigLookupImg" alt="">
          <div class="minifig-lookup-name" id="minifigLookupName"></div>
          <div class="minifig-lookup-buttons" id="minifigLookupButtons"></div>
        </div>
        <div class="minifig-lookup-hint" id="minifigLookupHint">
          Search for a minifigure to jump straight to its headwear, head, torso, or legs in the selectors on the left.
        </div>
      </div>
    </aside>
  </main>

  <footer class="footer">
    Powered by <a href="https://rebrickable.com" target="_blank">Rebrickable API</a>
    — LEGO® is a trademark of the LEGO Group
  </footer>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
